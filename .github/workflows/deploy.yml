# ⚠️ 실운영(smi.ceo)은 Railway가 담당합니다. 이 워크플로는 VPS(SSH)용 레거시입니다.
# Railway: railway.toml + Git 브랜치 0518 연동 → push 시 자동 배포
# 사용하지 않으면 workflow_dispatch만 남겨 두었습니다.

name: Deploy to Production (Legacy VPS)

on:
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: 0518
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install and build
      run: |
        npm ci
        npm ci --prefix server
        npm run build:production
        npm run verify:deploy
      env:
        NODE_ENV: production
        
    - name: Create deployment package
      run: |
        mkdir -p deploy
        cp -r dist deploy/
        cp -r server deploy/
        rm -rf deploy/server/node_modules
        cp package.json deploy/
        
    - name: Create tarball
      run: |
        tar -czf smi-app.tar.gz deploy/
        
    - name: Deploy to server via SSH
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "smi-app.tar.gz"
        target: "/tmp"
        
    - name: Extract and restart application
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /var/www/smi
          tar -xzf /tmp/smi-app.tar.gz
          cp -r deploy/* .
          rm -rf deploy
          rm /tmp/smi-app.tar.gz
          
          npm ci --omit=dev
          npm ci --prefix server --omit=dev
          npm run verify:deploy
          
          pm2 reload ecosystem.config.js --env production || pm2 restart all
          sudo nginx -t && sudo systemctl reload nginx
          
    - name: Health check
      run: |
        sleep 5
        curl -f https://smi.ceo/api/health || exit 1
