# Railway 배포 설정 (smi.ceo)
# Git 연동 브랜치: 0518 (또는 main merge 후 main)

[build]
builder = "NIXPACKS"
# postinstall 자동 빌드 대신 명시적 순서 — 프론트·서버 의존성 모두 설치 후 Vite 빌드
buildCommand = "npm ci && npm ci --prefix server && npm run build:production && npm run verify:deploy"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
